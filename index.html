<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cine Flix HD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ AdSense (UNA SOLA VEZ) -->
<script async 
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9698973471120203"
  crossorigin="anonymous"></script>

<!-- Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZRV1PVQLY8"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-ZRV1PVQLY8');
</script>

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
header{background:#111;padding:12px;position:sticky;top:0;z-index:10}
.logo{text-align:center;color:#e50914;font-size:24px;font-weight:bold}
.search{padding:10px;display:flex;justify-content:center}
.search input{
width:90%;max-width:400px;padding:10px;
border-radius:20px;border:none;outline:none
}
#movies{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:12px;padding:15px
}
.card{
background:#1c1c1c;border-radius:10px;
overflow:hidden;cursor:pointer;transition:.2s
}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:210px;object-fit:cover}
.card p{text-align:center;font-size:14px;padding:6px}

#ad-top,#ad-middle,#ad-bottom{text-align:center;margin:15px 0}

#tv{
position:fixed;inset:0;background:#000;
display:none;flex-direction:column;
justify-content:center;align-items:center;
z-index:9999
}
#player{width:100%;max-width:900px;height:55vh}
.controls{margin-top:10px;display:flex;gap:10px}
.controls button{
background:#e50914;border:none;padding:10px 20px;
border-radius:6px;color:#fff;font-size:16px;cursor:pointer
}

@media(max-width:600px){
#player{height:40vh}
.logo{font-size:20px}
}
</style>
</head>

<body>

<header>
<div class="logo">🎬 Cine Flix HD</div>
</header>

<!-- 🔍 Buscador -->
<div class="search">
<input type="text" placeholder="Buscar películas..." onkeyup="searchMovie(this.value)">
</div>

<!-- 🔥 ANUNCIO SUPERIOR (autorelaxed) -->
<div id="ad-top">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-format="autorelaxed"
     data-ad-client="ca-pub-9698973471120203"
     data-ad-slot="3415387702"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<div id="movies"></div>

<!-- 🔥 ANUNCIO IN-ARTICLE -->
<div id="ad-middle">
<ins class="adsbygoogle"
     style="display:block;text-align:center"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="ca-pub-9698973471120203"
     data-ad-slot="9789224360"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<div id="sentinel"></div>

<!-- 🔥 ANUNCIO RESPONSIVE FOOTER -->
<div id="ad-bottom">
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-9698973471120203"
     data-ad-slot="3725652545"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<!-- 🎥 PLAYER -->
<div id="tv">
<div id="player"></div>
<div class="controls">
<button onclick="next()">⏭ Siguiente</button>
<button onclick="closeTV()">❌ Cerrar</button>
</div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const OMDB="d58f0933";
const TMDB="a75df45f5957e88b88043e6e9558b941";
let page=1,playlist=[],index=0,player;

function onYouTubeIframeAPIReady(){
player=new YT.Player("player",{
playerVars:{autoplay:1,controls:1,rel:0,mute:1,playsinline:1},
events:{onStateChange:e=>{if(e.data===0)next();}}
});
}

function openTV(){tv.style.display="flex"}
function closeTV(){tv.style.display="none";player.stopVideo()}

function play(id){
openTV();
player.loadVideoById(id);
}

async function next(){
index++;
if(index>=playlist.length-1) await load();
playTrailer(playlist[index]);
}

async function playTrailer(imdb){
const f=await fetch(`https://api.themoviedb.org/3/find/${imdb}?api_key=${TMDB}&external_source=imdb_id`);
const d=await f.json();
if(!d.movie_results[0]) return next();
const v=await fetch(`https://api.themoviedb.org/3/movie/${d.movie_results[0].id}/videos?api_key=${TMDB}`);
const vd=await v.json();
const t=vd.results.find(x=>x.site==="YouTube");
t?play(t.key):next();
}

async function load(q="movie"){
const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&s=${q}&page=${page}`);
const d=await r.json();
if(d.Response==="True"){
d.Search.forEach(m=>{
playlist.push(m.imdbID);
const c=document.createElement("div");
c.className="card";
c.innerHTML=`<img src="${m.Poster}"><p>${m.Title}</p>`;
c.onclick=()=>{index=playlist.indexOf(m.imdbID);playTrailer(m.imdbID)};
movies.appendChild(c);
});
page++;
}
}

function searchMovie(q){
movies.innerHTML="";
playlist=[];
page=1;
if(q.length>2) load(q);
}

new IntersectionObserver(e=>e[0].isIntersecting&&load()).observe(sentinel);
window.onload=()=>load();
</script>

</body>
</html>
