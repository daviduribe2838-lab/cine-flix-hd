<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cine Flix HD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden}

/* BIENVENIDA */
#welcome{
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;
justify-content:center;align-items:center;
z-index:9999;text-align:center
}
#welcome h1{color:#e50914}
#welcome.hide{display:none}

/* FEED */
#feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory
}
.video{
height:100vh;
scroll-snap-align:start;
position:relative
}
iframe{width:100%;height:100%;border:none}

/* CONTROLES */
#controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:10;
display:flex;
gap:10px;
background:rgba(0,0,0,.6);
padding:10px 15px;
border-radius:20px;
align-items:center
}
#controls button{
background:#e50914;
border:none;
color:#fff;
padding:8px 12px;
border-radius:10px;
cursor:pointer
}
#controls input{width:80px}

/* LABEL AD */
#ad-label{
position:fixed;
top:10px;
left:10px;
background:#e50914;
padding:6px 12px;
border-radius:12px;
font-size:12px;
display:none;
z-index:10
}
</style>
</head>

<body>

<!-- BIENVENIDA -->
<div id="welcome">
<h1>🎬 Cine Flix HD</h1>
<p>Cargando trailers ilimitados…</p>
</div>

<div id="ad-label">Publicidad</div>

<!-- CONTROLES -->
<div id="controls">
<button onclick="prev()">⏮</button>
<button onclick="togglePlay()">⏯</button>
<button onclick="next()">⏭</button>
<button onclick="toggleMute()">🔊</button>
<input type="range" min="0" max="100" value="0" oninput="setVolume(this.value)">
</div>

<!-- FEED -->
<div id="feed"></div>

<script>
const OMDB="d58f0933";
const TMDB="a75df45f5957e88b88043e6e9558b941";

/* ADS DE VIDEO */
const ADS=["XGSy3_Czz8k","l482T0yNkeo"];

let page=1,players=[],current=0,muted=true,paused=false;
let loadTimer=null;

/* BIENVENIDA */
setTimeout(()=>{
welcome.classList.add("hide");
init();
},2500);

/* INICIO */
async function init(){
await load();
play(0);
observe();
}

/* CARGA DE CONTENIDO */
async function load(){
const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&s=movie&page=${page}`);
const d=await r.json();
if(d.Response==="True"){
for(const m of d.Search){
await addTrailer(m.imdbID);
if(players.length%5===0) addAd();
}
page++;
}
}

/* TRAILER */
async function addTrailer(imdb){
try{
const f=await fetch(`https://api.themoviedb.org/3/find/${imdb}?api_key=${TMDB}&external_source=imdb_id`);
const d=await f.json();
if(!d.movie_results[0]) return;
const v=await fetch(`https://api.themoviedb.org/3/movie/${d.movie_results[0].id}/videos?api_key=${TMDB}`);
const vd=await v.json();
const t=vd.results.find(x=>x.site==="YouTube");
if(!t) return;
createVideo(t.key,false);
}catch(e){}
}

/* ANUNCIO */
function addAd(){
const id=ADS[Math.floor(Math.random()*ADS.length)];
createVideo(id,true);
}

/* CREAR VIDEO */
function createVideo(id,isAd){
const div=document.createElement("div");
div.className="video";
div.dataset.ad=isAd;
div.innerHTML=
`<iframe src="https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=0&mute=1&controls=0&playsinline=1"></iframe>`;
feed.appendChild(div);
players.push(div.querySelector("iframe"));
}

/* PLAY CON DETECTOR */
function play(i){
stopAll();
current=i;
const iframe=players[i];
showAdLabel();

iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}',"*");
iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}',"*");

/* ⏱️ TIMEOUT: si no reproduce → skip */
clearTimeout(loadTimer);
loadTimer=setTimeout(()=>{
console.warn("Video no responde, saltando…");
next();
},6000);
}

/* DETECCIÓN DE MENSAJES YOUTUBE */
window.addEventListener("message",e=>{
if(!e.data || typeof e.data!=="string") return;
if(e.data.includes("onError")){
console.warn("Error de YouTube detectado");
next();
}
if(e.data.includes("onStateChange")){
clearTimeout(loadTimer);
}
});

/* CONTROLES */
function stopAll(){
players.forEach(p=>{
p.contentWindow.postMessage('{"event":"command","func":"stopVideo","args":""}',"*");
});
}

function next(){
if(current<players.length-1){
current++;
feed.scrollTo({top:current*innerHeight,behavior:"smooth"});
play(current);
if(current>=players.length-3) load();
}
}

function prev(){
if(current>0){
current--;
feed.scrollTo({top:current*innerHeight,behavior:"smooth"});
play(current);
}
}

function togglePlay(){
paused=!paused;
players[current].contentWindow.postMessage(
`{"event":"command","func":"${paused?"pauseVideo":"playVideo"}","args":""}`,"*");
}

function toggleMute(){
muted=!muted;
players[current].contentWindow.postMessage(
`{"event":"command","func":"${muted?"mute":"unMute"}","args":""}`,"*");
}

function setVolume(v){
players[current].contentWindow.postMessage(
`{"event":"command","func":"setVolume","args":[${v}]}`,"*");
}

/* SCROLL */
function observe(){
let obs=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
current=[...feed.children].indexOf(e.target);
play(current);
}
});
},{threshold:.7});
[...feed.children].forEach(v=>obs.observe(v));
}

/* LABEL */
function showAdLabel(){
adLabel.style.display=feed.children[current].dataset.ad==="true"?"block":"none";
}
</script>

</body>
</html>
