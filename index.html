<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cine Flix HD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9698973471120203" crossorigin="anonymous"></script>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

/* BIENVENIDA */
#welcome{
position:fixed;
inset:0;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:99999;
text-align:center;
}
#welcome h1{color:#e50914}
#welcome p{opacity:.8}
#welcome.hide{display:none}

/* VIDEO FEED */
#feed{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.video{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
scroll-snap-align:start;
}

iframe{
width:100%;
height:100%;
border:none;
}

/* CONTROLES */
.controls{
position:fixed;
right:10px;
bottom:80px;
z-index:10;
display:flex;
flex-direction:column;
gap:10px;
}
.controls button{
background:#e50914;
border:none;
color:#fff;
padding:10px;
border-radius:50%;
font-size:14px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- BIENVENIDA -->
<div id="welcome">
<h1>🎬 Cine Flix HD</h1>
<p>Disfruta tráilers ilimitados<br>La reproducción comienza ahora</p>
</div>

<!-- CONTROLES -->
<div class="controls">
<button onclick="toggleSound()">🔊</button>
</div>

<!-- FEED DE VIDEOS -->
<div id="feed"></div>

<script>
const OMDB="d58f0933";
const TMDB="a75df45f5957e88b88043e6e9558b941";
let page=1,playlist=[],current=0,players=[],muted=true;

/* BIENVENIDA */
setTimeout(()=>{
welcome.classList.add("hide");
init();
},3000);

/* INICIO */
async function init(){
await load();
playVideo(0);
observeScroll();
}

/* CARGAR MÁS PELÍCULAS */
async function load(){
const r=await fetch(`https://www.omdbapi.com/?apikey=${OMDB}&s=movie&page=${page}`);
const d=await r.json();
if(d.Response==="True"){
for(const m of d.Search){
playlist.push(m.imdbID);
await createVideo(m.imdbID);
}
page++;
}
}

/* CREAR VIDEO */
async function createVideo(imdb){
const f=await fetch(`https://api.themoviedb.org/3/find/${imdb}?api_key=${TMDB}&external_source=imdb_id`);
const d=await f.json();
if(!d.movie_results[0]) return;
const v=await fetch(`https://api.themoviedb.org/3/movie/${d.movie_results[0].id}/videos?api_key=${TMDB}`);
const vd=await v.json();
const t=vd.results.find(x=>x.site==="YouTube");
if(!t) return;

const div=document.createElement("div");
div.className="video";
div.innerHTML=`<iframe src="https://www.youtube.com/embed/${t.key}?autoplay=0&mute=1&controls=0&playsinline=1"></iframe>`;
feed.appendChild(div);
players.push(div.querySelector("iframe"));
}

/* REPRODUCIR VIDEO */
function playVideo(i){
players.forEach((p,index)=>{
p.contentWindow.postMessage('{"event":"command","func":"stopVideo","args":""}',"*");
});
const iframe=players[i];
iframe.src=iframe.src.replace("autoplay=0","autoplay=1");
}

/* SCROLL INFINITO */
function observeScroll(){
let observer=new IntersectionObserver(entries=>{
entries.forEach(e=>{
if(e.isIntersecting){
current=[...feed.children].indexOf(e.target);
playVideo(current);
if(current>=players.length-2) load();
}
});
},{threshold:.6});

[...feed.children].forEach(v=>observer.observe(v));
}

/* SONIDO */
function toggleSound(){
muted=!muted;
players.forEach(p=>{
p.contentWindow.postMessage(
`{"event":"command","func":"${muted?"mute":"unMute"}","args":""}`,"*"
);
});
}
</script>

</body>
</html>
